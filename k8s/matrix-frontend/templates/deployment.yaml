apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploy.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.deploy.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.deploy.name }}
    spec:
      imagePullSecrets:
      - name: nexus
      containers:
        - name: {{ .Values.deploy.name }}
          image: {{ .Values.deploy.image }}
          # Образ собирается через `minikube image build` — оседает прямо в
          # docker'е minikube'а, без push в registry. Never блокирует попытки
          # docker pull.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9091
          # Probes рассчитаны на ~30-40 сек холодного старта (Liquibase + Spring context).
          # Стучатся в 9091 (management) — изолированы от 8080, не страдают
          # от выгоревшего пула основного connector'а.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9091
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
