apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: privatecloud-pki
  name: {{ .Values.deploy.name }}
  labels:
    name: {{ .Values.deploy.name }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.deploy.namecluster }}
    http:
      paths:
      - pathType: Prefix
        path: "/_matrix"
        backend:
          service:
            name: {{ .Values.matrixkc.serviceName }}
            port:
              number: 8080
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: {{ .Values.deploy.name }}
            port:
              number: 8080
  tls:
  - hosts:
    - {{ .Values.deploy.namecluster }}
    secretName: {{ .Values.deploy.namecluster }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: privatecloud-pki
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  name: {{ .Values.deploy.name }}-media-upload
  labels:
    name: {{ .Values.deploy.name }}
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.deploy.namecluster }}
    http:
      paths:
      - pathType: Prefix
        path: "/_matrix/media/v3/upload"
        backend:
          service:
            name: {{ .Values.matrixkc.serviceName }}
            port:
              number: 8080
  tls:
  - hosts:
    - {{ .Values.deploy.namecluster }}
    secretName: {{ .Values.deploy.namecluster }}
